<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My To-Do</title>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("my-todo-settings") || "{}");
        if (s.theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        } else if (s.theme === "gold") {
          document.documentElement.setAttribute("data-theme", "gold");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true">✓</span>
        <h1 class="header__title">My To-Do</h1>
      </div>
      <button type="button" class="btn btn--icon" id="settingsBtn" aria-label="Open settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </header>

    <main class="app__main">
    <section class="stats" aria-label="Progress statistics">
      <div class="stats__ring" id="progressRing" role="img" aria-label="0% complete">
        <svg viewBox="0 0 120 120" class="stats__svg">
          <circle class="stats__track" cx="60" cy="60" r="52" />
          <circle class="stats__fill" cx="60" cy="60" r="52" id="progressCircle" />
        </svg>
        <div class="stats__center">
          <span class="stats__percent" id="progressPercent">0%</span>
          <span class="stats__label">done</span>
        </div>
      </div>
      <div class="stats__details">
        <div class="stats__item stats__item--total">
          <span class="stats__value" id="statTotal">0</span>
          <span class="stats__name">Total</span>
        </div>
        <div class="stats__item stats__item--active">
          <span class="stats__value" id="statActive">0</span>
          <span class="stats__name">Active</span>
        </div>
        <div class="stats__item stats__item--done">
          <span class="stats__value" id="statCompleted">0</span>
          <span class="stats__name">Done</span>
        </div>
        <div class="stats__bar-wrap">
          <div class="stats__bar" id="progressBar" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <form class="add-form" id="addForm" autocomplete="off">
      <div class="add-form__row">
        <input
          type="text"
          id="taskTitle"
          class="add-form__input add-form__input--title"
          placeholder="What needs to be done?"
          maxlength="200"
          required
        />
        <button type="submit" class="btn btn--primary" id="addBtn">
          <span>Add</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <input
        type="text"
        id="taskDescription"
        class="add-form__input add-form__input--desc"
        placeholder="Optional description…"
        maxlength="500"
      />
    </form>

    <div class="toolbar">
      <div class="search" role="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="searchInput"
          class="search__input"
          placeholder="Search tasks…"
          autocomplete="off"
        />
      </div>
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter-btn filter-btn--active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Done</button>
      </div>
    </div>

    <div class="task-area">
      <ul class="task-list" id="taskList" aria-live="polite"></ul>
      <p class="empty-state" id="emptyState" hidden>
        <span class="empty-state__icon" aria-hidden="true">—</span>
        <span id="emptyMessage">No tasks yet — add one above!</span>
      </p>
    </div>
    </main>

    <footer class="footer">
      <button type="button" class="btn btn--ghost btn--danger" id="clearCompletedBtn" hidden>
        Clear completed
      </button>
      <span class="footer__hint" id="dragHint">Drag tasks to reorder</span>
    </footer>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <div class="modal__header">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" class="btn btn--icon modal__close" id="closeSettings" aria-label="Close settings">×</button>
      </div>
      <div class="modal__body">
        <label class="toggle toggle--select">
          <span class="toggle__text">
            <strong>Theme</strong>
            <small>Choose your preferred appearance</small>
          </span>
          <select id="themeSelect" class="theme-select">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="gold">Gold</option>
          </select>
        </label>
        <label class="toggle">
          <input type="checkbox" id="persistToggle" checked />
          <span class="toggle__slider"></span>
          <span class="toggle__text">
            <strong>Remember tasks after closing browser</strong>
            <small>Off = tasks reset when you close the tab</small>
          </span>
        </label>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--primary" id="saveSettings">Done</button>
      </div>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="modal-overlay" id="deleteModal" hidden>
    <div class="modal modal--sm" role="dialog" aria-labelledby="deleteTitle" aria-modal="true">
      <div class="modal__header">
        <h2 id="deleteTitle">Delete task?</h2>
      </div>
      <div class="modal__body">
        <p id="deleteMessage">This cannot be undone.</p>
      </div>
      <div class="modal__footer modal__footer--split">
        <button type="button" class="btn btn--ghost" id="cancelDelete">Cancel</button>
        <button type="button" class="btn btn--danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
